  $('combineBtn').addEventListener('click', combineStamps);
  $('inbIn').addEventListener('change', e => { const m = curMove(); if (m) { m.inb = Math.max(0, Math.min(12, Math.round(+e.target.value) || 0)); refresh(); } });
  $('easeSel').addEventListener('change', e => { const m = curMove(); if (m) { m.ease = e.target.value; refresh(); } });
  $('arcIn').addEventListener('change', e => { const m = curMove(); if (m) { m.arc = +e.target.value / 100; refresh(); } });
  $('speedSel').addEventListener('change', e => { const m = curMove(); if (m) { m.speed = parseFloat(e.target.value); refresh(); } });
  $('openBtn').addEventListener('click', () => $('openFile').click());
  $('openFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) await setSheet(await readFile(f), f.name);
  });
  $('uploadPartsBtn').addEventListener('click', () => $('partFiles').click());
  $('partFiles').addEventListener('change', async e => {
    const files = [...e.target.files]; e.target.value = '';
    const batch = newId('b');
    for (const f of files) await addUploadedPart(f, batch);
    refresh();
  });

  // drag and drop: a full image onto the sheet, part images onto the parts list
  for (const [box, onDrop] of [
    [$('leftBox'), async files => { await setSheet(await readFile(files[0]), files[0].name); }],
    [$('rightBox'), async files => { const batch = newId('b'); for (const f of files) await addUploadedPart(f, batch); refresh(); }],
  ]) {
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drop'); });
    box.addEventListener('dragleave', e => { if (!box.contains(e.relatedTarget)) box.classList.remove('drop'); });
    box.addEventListener('drop', async e => {
      e.preventDefault(); box.classList.remove('drop');
      const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
      if (files.length) await onDrop(files);
    });
  }

  new ResizeObserver(() => { fit(); if (puppetTab()) fitRig(); render(); }).observe($('stage'));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- this browser's copy, between saves ----------

  let saveTimer = null, restoring = true, savedSig = null;
  S.puppetId = null; S.puppetName = '';

  function serialize() {
    return {
      v: 1, name: S.puppetName, mode: S.mode, tab: S.tab, moves: S.moves, moveId: S.moveId,
      sheets: S.sheets.map(sh => ({ id: sh.id, name: sh.name, example: sh.example, mode: sh.mode, dataURL: sh.example ? null : sh.dataURL })),
      sheetId: S.sheet && S.sheet.id,
      parts: S.parts.map(p => ({ id: p.id, name: p.name, kind: p.kind, sheetId: p.sheetId, poly: p.poly, x: p.x, y: p.y, mode: p.mode, orig: p.orig, url: p.url, rig: p.rig, smooth: p.smooth, batch: p.batch,
        variants: p.variants && p.variants.map(v => ({ url: v.url, dx: v.dx, dy: v.dy, name: v.name })) })),
    };
  }
  // a cheap fingerprint of everything except the images, to tell whether there are unsaved changes
  const signature = () => JSON.stringify([S.puppetName, S.sheets.map(sh => [sh.id, sh.mode]), S.moves,
    S.parts.map(p => [p.id, p.name, p.poly, p.mode, p.rig, p.smooth, (p.variants || []).map(v => [v.dx, v.dy, v.url.length]), p.kind === 'upload' ? p.orig.length : 0])]);
  const isDirty = () => signature() !== savedSig;

  // ---------- undo ----------
  // Every change that reaches persist() is one step. A step is a snapshot of the puppet; images are
  // shared, not copied, because a part's image is replaced (never edited) when it changes.

  let undoStack = [], redoStack = [], lastSnap = null, lastSig = null, undoing = false;
  const clonePart = p => ({ ...p, rig: p.rig && structuredClone(p.rig), poly: p.poly && p.poly.map(q => q.slice()),
    smooth: p.smooth && { ...p.smooth }, variants: p.variants && p.variants.map(v => ({ ...v })) });
  const snapshot = () => ({ parts: S.parts.map(clonePart), moves: structuredClone(S.moves), moveId: S.moveId, frame: S.frame,
    sheets: S.sheets.slice(), sheetModes: S.sheets.map(sh => sh.mode), sheetId: S.sheet && S.sheet.id, puppetName: S.puppetName });
  function resetHistory() { undoStack = []; redoStack = []; lastSnap = snapshot(); lastSig = signature(); renderUndo(); }
  function record() {
    if (undoing || !lastSnap) return;
    const sig = signature();
    if (sig === lastSig) return;
    undoStack.push(lastSnap);
    if (undoStack.length > 60) undoStack.shift();
    redoStack = [];
    lastSnap = snapshot(); lastSig = sig;
    renderUndo();
  }
  function restoreSnap(sn) {
    undoing = true;
    if (S.playing) stopPlay();
    if (S.rec) stopRec();
    S.parts = sn.parts.map(clonePart);
    S.moves = structuredClone(sn.moves); S.moveId = sn.moveId; S.frame = sn.frame;
    S.sheets = sn.sheets.slice(); S.sheets.forEach((sh, i) => { sh.mode = sn.sheetModes[i]; });
    S.puppetName = sn.puppetName;
    S.sel = new Set([...S.sel].filter(id => byId(id)));
    S.draft = null; S.join = null; S.rdrag = null;
    showSheet(sheetById(sn.sheetId) || S.sheets[S.sheets.length - 1]);
    lastSnap = snapshot(); lastSig = signature();
    undoing = false;
    refresh(); renderUndo();
  }
  function undo() { if (!undoStack.length) return; redoStack.push(lastSnap); restoreSnap(undoStack.pop()); }
  function redo() { if (!redoStack.length) return; undoStack.push(lastSnap); restoreSnap(redoStack.pop()); }
  function renderUndo() { $('undoBtn').disabled = !undoStack.length; $('redoBtn').disabled = !redoStack.length; }
  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);

  // The browser copy lives in IndexedDB, which holds far more than localStorage's ~5 MB
  // (several full-size scans don't fit there). localStorage is only a fallback.
  const idb = (() => {
    let opening = null;
    const open = () => opening || (opening = new Promise((res, rej) => {
      const q = indexedDB.open('puppet-rig', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('kv');
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    }));
    const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => {
      const t = d.transaction('kv', mode), q = fn(t.objectStore('kv'));
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }); };
    return { get: k => tx('readonly', st => st.get(k)), set: (k, v) => tx('readwrite', st => st.put(v, k)) };
  })();
  async function keepCopy(key, text) {
    try { if (!window.indexedDB) throw 0; await idb.set(key, text); return true; }
    catch { try { localStorage.setItem(key, text); return true; } catch { return false; } }
  }
  async function readCopy(key) {
    try { if (window.indexedDB) { const v = await idb.get(key); if (v) return v; } } catch { /* fall through */ }
    try { return localStorage.getItem(key); } catch { return null; }
  }

  let copyFailed = false;
  function persist() {
    if (restoring) return;
    record();
    renderFileUI();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const ok = await keepCopy(STORE, JSON.stringify({ ...serialize(), puppetId: S.puppetId, savedSig }));
      if (ok !== !copyFailed) { copyFailed = !ok; renderFileUI(); }
    }, 400);
  }

  async function loadData(data) {
    restoring = true;
    if (S.playing) { S.playing = false; cancelAnimationFrame(raf); }
    if (S.rec) { S.rec = null; cancelAnimationFrame(raf); }
    Object.assign(S, { parts: [], sheets: [], sheet: null, moves: [], moveId: null, frame: 0, draft: null, join: null, selected: null, sel: new Set(), rigFitted: false, tab: 'cut' });
    S.puppetName = data.name || '';
    S.mode = data.mode || 'outside';
    for (const p of data.parts || []) {
      const part = { ...p };
      if (p.variants) part.variants = await Promise.all(p.variants.map(async v => {
        const im = await loadImage(v.url), c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
        c.getContext('2d').drawImage(im, 0, 0);
        return { ...v, canvas: c };
      }));
      if (p.kind === 'upload') { part.img = await loadImage(p.orig); processUpload(part); }
      else { const im = await loadImage(p.url); const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0); part.canvas = c; }
      S.parts.push(part);
    }
    // older saves kept a single sheet
    const sheets = data.sheets || (data.sheet ? [{ ...data.sheet, mode: data.mode }] : []);
    for (const sh of sheets) await addSheet(sh.example ? exampleSheet() : sh.dataURL, sh.name, sh.example, sh.id, sh.mode || data.mode);
    if (!S.sheets.length) await addSheet(exampleSheet(), 'example', true);
    showSheet(sheetById(data.sheetId) || S.sheets[S.sheets.length - 1]);
    S.moves = data.moves || []; S.moveId = data.moveId || (S.moves[0] && S.moves[0].id) || null;
    if (data.tab === 'rig' || data.tab === 'move') { S.tab = data.tab; S.parts.forEach(ensureRig); fitRig(); }
    if (S.tab === 'move' && !S.moves.length) newMove();
    const m = curMove(); if (S.tab === 'move' && m && m.frames[0]) applyPose(m.frames[0]);
    restoring = false;
    resetHistory();
  }

  async function restore() {
    const raw = await readCopy(STORE);
    let data = null;
    try { data = JSON.parse(raw || 'null'); } catch { data = null; }
    try { await loadData(data || {}); S.puppetId = data ? data.puppetId || null : null; savedSig = data && data.savedSig ? data.savedSig : signature(); }
    catch {
      // don't let a fresh start overwrite work we couldn't reopen: keep it aside first
      if (raw) await keepCopy(STORE + '/backup', raw);
      await loadData({}); savedSig = signature();
      restoreFailed = true;
    }
    refresh();
  }
  let restoreFailed = false;

  // ---------- saving to your account ----------
  // Each person's puppets are private to them: data/users/<their id>/<puppetId> holds the summary,
  // and the puppet itself (images included) is split across .../<puppetId>/chunks/<n>, because one
  // stored document can hold at most 256 KB.

  let db = null, uid = null, dbReady = false;
  const CHUNK = 180000;
  const note = t => { $('saveNote').textContent = t; };

  function renderFileUI() {
    const name = $('puppetName');
    if (document.activeElement !== name) name.value = S.puppetName;
    const account = !!(db && uid);
    $('saveBtn').textContent = !dbReady || account ? 'Save' : 'Save file';
    $('saveBtn').title = account ? 'Save to your account' : 'Download the whole puppet as a file you can open again later';
    $('puppetsSummary').textContent = !dbReady || account ? 'My puppets' : 'Puppet files';
    if (!dbReady) return;
    if (restoreFailed) { note('Couldn’t reopen your last session here, so a copy was kept aside. Open a saved puppet from My puppets.'); return; }
    if (copyFailed) { note('This browser can’t keep your latest changes. Press Save to keep them.'); return; }
    if (!db || !uid) note(S.parts.length ? 'Kept in this browser. Use Save file for a copy you can keep.' : '');
    else if (!S.puppetId) note(S.parts.length ? 'Not saved yet' : '');
    else if (isDirty()) note('Unsaved changes');
    else if (S.savedAt) note(`Saved ${S.savedAt}`);
    else note('');
  }

  function saveError(e) {
    const code = e && e.code;
    if (code === 'not_granted' || code === 'revoked') return 'You can’t save here. Ask the owner to share this page with you as a Contributor.';
    if (code === 'quota_exceeded') return 'Storage is full. Delete a puppet you no longer need from My puppets, then save again.';
    if (code === 'invalid_argument') return 'This puppet is too big to save. Try smaller images.';
    return 'Couldn’t save. Check your connection and try again.';
  }

  function thumbnail() {
    const c = document.createElement('canvas'); c.width = 160; c.height = 160;
    const x = c.getContext('2d');
    if (S.parts.length && S.parts.every(p => p.rig)) {
      const bs = S.parts.map(worldBounds);
      const x0 = Math.min(...bs.map(b => b[0])), y0 = Math.min(...bs.map(b => b[1]));
      const w = Math.max(...bs.map(b => b[2])) - x0, h = Math.max(...bs.map(b => b[3])) - y0;
      const k = 150 / Math.max(w, h, 1);
      for (const p of S.parts) {
        const m = world(p);
        x.setTransform(k, 0, 0, k, (160 - w * k) / 2 - x0 * k, (160 - h * k) / 2 - y0 * k);
        x.transform(m.a, m.b, m.c, m.d, m.e, m.f);
        drawFace(x, p);
      }
    } else if (S.processed) {
      const k = 150 / Math.max(S.processed.width, S.processed.height);
      x.drawImage(S.processed, (160 - S.processed.width * k) / 2, (160 - S.processed.height * k) / 2, S.processed.width * k, S.processed.height * k);
    }
    const url = c.toDataURL('image/webp', .8);
    return url.startsWith('data:image/webp') ? url : c.toDataURL('image/png');
  }

  async function saveToAccount() {
    if (!db || !uid) return;
    if (S.playing) stopPlay();
    if (S.rec) stopRec();
    $('saveBtn').disabled = true; note('Saving…');
    try {
      const pid = S.puppetId || newId('pz');
      const str = JSON.stringify(serialize());
      const n = Math.ceil(str.length / CHUNK);
      const chunks = db.collection(`data/users/${uid}/${pid}/chunks`);
      for (let i = 0; i < n; i++) await chunks.doc(String(i)).set({ d: str.slice(i * CHUNK, (i + 1) * CHUNK) });
      const meta = db.collection(`data/users/${uid}`).doc(pid);
      const old = await meta.get();
      const oldN = old.exists ? (old.data().chunks || 0) : 0;
      await meta.set({ kind: 'puppet', name: S.puppetName || 'Untitled puppet', updated: Date.now(), chunks: n, parts: S.parts.length, moves: S.moves.length, thumb: thumbnail() });
      for (let i = n; i < oldN; i++) await chunks.doc(String(i)).delete();
      S.puppetId = pid; savedSig = signature();
      S.savedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      persist(); listPuppets();
    } catch (e) { note(saveError(e)); $('saveBtn').disabled = false; return; }
    renderFileUI();
  }

  async function listPuppets() {
    const box = $('puppetList');
    if (!db || !uid) { box.innerHTML = '<div class="empty">Puppets are kept in this browser. Download a puppet file to keep a copy or move it to another computer.</div>'; return; }
    let docs = [];
    try { docs = (await db.collection(`data/users/${uid}`).get()).docs.filter(d => d.data().kind === 'puppet'); }
    catch { box.innerHTML = '<div class="empty">Couldn’t load your puppets. Try again in a moment.</div>'; return; }
    docs.sort((a, b) => b.data().updated - a.data().updated);
    box.textContent = '';
    if (!docs.length) { box.innerHTML = '<div class="empty">No saved puppets yet. Name this one at the top and press Save.</div>'; return; }
    for (const d of docs) {
      const v = d.data();
      const row = document.createElement('div'); row.className = 'saved' + (d.id === S.puppetId ? ' current' : '');
      const th = document.createElement('div'); th.className = 'thumb';
      if (v.thumb) { const im = document.createElement('img'); im.src = v.thumb; im.alt = ''; th.append(im); }
      const body = document.createElement('div'); body.className = 'part-body';
      const t = document.createElement('div'); t.textContent = v.name; t.style.fontWeight = '500';
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = `${v.parts} parts · ${v.moves} movements · ${new Date(v.updated).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`;
      const acts = document.createElement('div'); acts.className = 'row-actions';
      const open = document.createElement('button'); open.type = 'button'; open.textContent = d.id === S.puppetId ? 'Reopen' : 'Open';
      open.addEventListener('click', () => armed(open, isDirty(), 'Discard changes & open', () => openPuppet(d.id)));
      const del = document.createElement('button'); del.type = 'button'; del.textContent = 'Delete';
      del.addEventListener('click', () => armed(del, true, 'Confirm delete', () => deletePuppet(d.id, v.chunks)));
      acts.append(open, del);
      body.append(t, m, acts); row.append(th, body); box.append(row);
    }
  }

  // two-step buttons (the page can't show confirm dialogs)
  function armed(btn, needed, label, go) {
    if (!needed || btn.dataset.armed) { go(); return; }
    const was = btn.textContent;
    btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('danger');
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = was; btn.classList.remove('danger'); } }, 3500);
  }

  async function openPuppet(pid) {
    note('Opening…');
    try {
      const meta = await db.collection(`data/users/${uid}`).doc(pid).get();
      const n = meta.data().chunks;
      const chunks = db.collection(`data/users/${uid}/${pid}/chunks`);
      const parts = await Promise.all([...Array(n)].map((_, i) => chunks.doc(String(i)).get()));
      const data = JSON.parse(parts.map(c => c.data().d).join(''));
      await loadData(data);
      S.puppetId = pid; savedSig = signature(); S.savedAt = null;
      $('myPuppets').open = false;
      refresh(); listPuppets();
      note(`Opened ${S.puppetName || 'puppet'}`);
    } catch { note('Couldn’t open that puppet. Try again in a moment.'); }
  }

  async function deletePuppet(pid, n) {
    try {
      const chunks = db.collection(`data/users/${uid}/${pid}/chunks`);
      for (let i = 0; i < n; i++) await chunks.doc(String(i)).delete();
      await db.collection(`data/users/${uid}`).doc(pid).delete();
      if (pid === S.puppetId) { S.puppetId = null; savedSig = null; }
      listPuppets(); renderFileUI();
    } catch { note('Couldn’t delete that puppet. Try again in a moment.'); }
  }

  async function downloadPuppetFile() {
    try {
      const blob = new Blob([JSON.stringify({ app: 'puppet-rig', ...serialize() })], { type: 'application/json' });
      note(await offerFile(`${(S.puppetName || 'puppet').replace(/[\\/:*?"<>|]+/g, ' ').trim()}.puppet.json`, blob));
    } catch (e) { note(e && e.message ? e.message : 'Couldn’t download the puppet file.'); }
  }
  async function openPuppetFileFrom(file) {
    try {
      const data = JSON.parse(await file.text());
      if (data.app !== 'puppet-rig') throw new Error('not a puppet file');
      await loadData(data);
      S.puppetId = null; savedSig = signature(); S.savedAt = null;
      $('myPuppets').open = false;
      refresh(); note(`Opened ${S.puppetName || 'puppet file'}`);
    } catch { note('That file isn’t a Puppet Rig puppet file.'); }
  }
  $('dlPuppet').addEventListener('click', downloadPuppetFile);
  $('openPuppetFile').addEventListener('click', e => armed(e.currentTarget, isDirty(), 'Discard changes & open', () => $('puppetFileIn').click()));
  $('puppetFileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openPuppetFileFrom(f); });
  $('saveBtn').addEventListener('click', () => { if (db && uid) saveToAccount(); else downloadPuppetFile(); });
  $('puppetName').addEventListener('input', e => { S.puppetName = e.target.value.trim(); persist(); });
  $('newPuppet').addEventListener('click', e => armed(e.currentTarget, isDirty(), 'Discard changes?', async () => {
    await loadData({}); S.puppetId = null; savedSig = signature(); S.savedAt = null; refresh();
  }));
  $('myPuppets').addEventListener('toggle', () => { if ($('myPuppets').open) listPuppets(); });
  document.addEventListener('click', e => { if ($('myPuppets').open && !$('myPuppets').contains(e.target)) $('myPuppets').open = false; });

  (async () => {
    const use = window.claude && window.claude.use ? window.claude.use : null;
    if (use) {
      try {
        const [d, u] = await Promise.all([use('db'), use('user')]);
        db = d; uid = u ? await u.id() : null;
      } catch { db = null; }
    }
    dbReady = true;
    renderFileUI();
  })();

  // ---------- export ----------

  const loadScript = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.append(el); });
  const fileName = ext => `${(S.puppetName || 'puppet')} - ${(curMove() || {}).name || 'movement'}`.replace(/[\\/:*?"<>|]+/g, ' ').trim() + '.' + ext;

  function exportLayout(m, maxSide, even) {
    const now = capturePose();
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    for (const { pose: f } of playlist(m)) {
      applyPose(f);
      for (const p of S.parts) { const w = worldBounds(p); b = [Math.min(b[0], w[0]), Math.min(b[1], w[1]), Math.max(b[2], w[2]), Math.max(b[3], w[3])]; }
    }
    applyPose(now);
    const pad = Math.max(b[2] - b[0], b[3] - b[1]) * 0.06;
    const bw = b[2] - b[0] + pad * 2, bh = b[3] - b[1] + pad * 2;
    const k = maxSide / Math.max(bw, bh);
    let W = Math.round(bw * k), H = Math.round(bh * k);
    if (even) { W += W % 2; H += H % 2; }
    return { W, H, k, ox: (W - (b[2] - b[0]) * k) / 2 - b[0] * k, oy: (H - (b[3] - b[1]) * k) / 2 - b[1] * k };
  }

  function drawExportFrame(x, L, pose, bg) {
    applyPose(pose);
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, L.W, L.H);
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, L.W, L.H); }
    x.imageSmoothingQuality = 'high';
    for (const p of S.parts) {
      const m = world(p);
      x.setTransform(L.k, 0, 0, L.k, L.ox, L.oy);
      x.transform(m.a, m.b, m.c, m.d, m.e, m.f);
      drawFace(x, p);
    }
  }

  async function offerFile(name, blob) {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) {
      // an ordinary web page (e.g. on GitHub Pages): a plain download link does it
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return 'Downloaded.';
    }
    try { await dl.save({ filename: name, data: blob }); return 'Saved to your computer.'; }
    catch (e) { if (e && e.code === 'declined') return 'Download cancelled.'; throw new Error('The download didn’t go through. Try again.'); }
  }

  async function exportGif(m, L, bg, transparent, status) {
    const { GIFEncoder, quantize, applyPalette } = await import('https://unpkg.com/gifenc@1.0.3/dist/gifenc.esm.js');
    const c = document.createElement('canvas'); c.width = L.W; c.height = L.H;
    const x = c.getContext('2d', { willReadFrequently: true });
    const gif = GIFEncoder();
    // round where each frame ends, not each frame's length, so the loop keeps its tempo
    const secs = stepSecs(m), list = playlist(m);
    let prevEnd = 0;
    for (let i = 0; i < list.length; i++) {
      drawExportFrame(x, L, list[i].pose, transparent ? null : bg);
      const { data } = x.getImageData(0, 0, L.W, L.H);
      const end = Math.round((i + 1) * secs * 100) * 10, delay = Math.max(20, end - prevEnd); prevEnd = end;
      if (transparent) {
        const palette = quantize(data, 256, { format: 'rgba4444', oneBitAlpha: true });
        const index = applyPalette(data, palette, 'rgba4444');
        const ti = palette.findIndex(col => col[3] === 0);
        gif.writeFrame(index, L.W, L.H, { palette, delay, transparent: ti >= 0, transparentIndex: Math.max(0, ti), dispose: 2 });
      } else {
        const palette = quantize(data, 256);
        gif.writeFrame(index_(applyPalette, data, palette), L.W, L.H, { palette, delay });
      }
      status(`Making GIF… frame ${i + 1} of ${list.length}`);
      await new Promise(r => setTimeout(r));
    }
    gif.finish();
    return new Blob([gif.bytes()], { type: 'image/gif' });
  }
  const index_ = (applyPalette, data, palette) => applyPalette(data, palette);

  async function exportMp4(m, L, bg, loops, status) {
    if (!('VideoEncoder' in window)) throw new Error('MP4 export needs a newer browser (recent Chrome, Edge or Safari). GIF works everywhere.');
    if (!window.Mp4Muxer) await loadScript('https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.js');
    const fps = Math.min(60, Math.max(1, Math.round(1 / stepSecs(m))));
    let config = null;
    for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']) {
      const cfg = { codec, width: L.W, height: L.H, bitrate: 6e6, framerate: fps };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) { config = cfg; break; } } catch { /* try the next */ }
    }
    if (!config) throw new Error('This browser can’t make MP4 at this size. Try a smaller size, or GIF.');
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: L.W, height: L.H }, fastStart: 'in-memory' });
    let failed = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { failed = e; } });
    enc.configure(config);
    const c = document.createElement('canvas'); c.width = L.W; c.height = L.H;
    const x = c.getContext('2d');
    const list = playlist(m), us = stepSecs(m) * 1e6, total = list.length * loops;
    let lastKey = -Infinity;
    for (let i = 0; i < total; i++) {
      if (failed) throw new Error('The video encoder stopped. Try GIF, or a smaller size.');
      drawExportFrame(x, L, list[i % list.length].pose, bg);
      const t = Math.round(i * us), next = Math.round((i + 1) * us);
      const vf = new VideoFrame(c, { timestamp: t, duration: next - t });
      const key = t - lastKey >= 2e6;
      if (key) lastKey = t;
      enc.encode(vf, { keyFrame: key });
      vf.close();
      while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));
      if (i % 10 === 0) { status(`Making MP4… ${Math.round(i / total * 100)}%`); await new Promise(r => setTimeout(r)); }
    }
    await enc.flush();
    muxer.finalize();
    return new Blob([muxer.target.buffer], { type: 'video/mp4' });
  }

  function renderExportUI() {
    const mp4 = $('exFormat').value === 'mp4';
    $('exTransWrap').hidden = mp4;
    $('exLoopsWrap').hidden = !mp4;
    $('exBg').disabled = !mp4 && $('exTrans').checked;
  }
  $('exportBtn').addEventListener('click', () => {
    if (S.playing) stopPlay();
    $('exportPanel').hidden = !$('exportPanel').hidden; $('exStatus').textContent = ''; renderExportUI();
  });
  $('exClose').addEventListener('click', () => { $('exportPanel').hidden = true; });
  $('exFormat').addEventListener('change', renderExportUI);
  $('exTrans').addEventListener('change', renderExportUI);
  $('exGo').addEventListener('click', async () => {
    const m = curMove(), st = t => { $('exStatus').textContent = t; };
    if (!m || !m.frames.length) { st('This movement has no frames yet.'); return; }
    if (S.playing) stopPlay();
    const mp4 = $('exFormat').value === 'mp4';
    const L = exportLayout(m, +$('exSize').value, mp4);
    const keep = capturePose(), btn = $('exGo');
    btn.disabled = true;
    try {
      const blob = mp4
        ? await exportMp4(m, L, $('exBg').value, Math.max(1, Math.min(50, +$('exLoops').value || 1)), st)
        : await exportGif(m, L, $('exBg').value, $('exTrans').checked, st);
      applyPose(keep); render();
      st(`Ready (${(blob.size / 1048576).toFixed(1)} MB). Confirm the download…`);
      st(await offerFile(fileName(mp4 ? 'mp4' : 'gif'), blob));
    } catch (e) {
      applyPose(keep); render();
      st(e && e.message ? e.message : 'Export didn’t work. Try again.');
    } finally { btn.disabled = false; }
  });

  fit();
  restore();
})();
</script>
</body>
